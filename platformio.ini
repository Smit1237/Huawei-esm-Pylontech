; Huawei ESM battery bank to Pylontech converter (Deye "Lithium mode 12").
; This firmware reads 1 to N Huawei ESM packs over RS485/Modbus. It combines the
; packs into ONE virtual battery. It shows the battery to a Deye hybrid inverter as a Pylontech BMS.
; Refer to README.md for the wiring, the CAN-terminator requirement and the flash steps.

[platformio]
default_envs = bank_esp32

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

; Every environment shares these RS485 pins. Change them per board if your pins differ:
;   ESM  bus  ->  UART1  TX=GPIO33  RX=GPIO32   (connect to the battery COM port)
;   Deye bus  ->  UART2  TX=GPIO26  RX=GPIO25   (connect to the inverter BMS/CAN port)
; These four pins are free, non-strapping and output-capable on WROOM-32 / WROVER.
; The WROVER PSRAM uses pins 16 and 17, so do not use them. The Deye responder
; answers as Pylontech address 0x02.
[rs485_pins]
build_flags =
    -DESM_TX_PIN=33
    -DESM_RX_PIN=32
    -DDEYE_TX_PIN=26
    -DDEYE_RX_PIN=25
    -DDEYE_ADDR=0x02

; TFT_eSPI configuration for the LilyGO T-Display v1.1 (ST7789 135x240).
[tdisplay_tft_flags]
build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    -DTFT_BL=4
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_GFXFF=1
    -DSPI_FREQUENCY=40000000

; ============================================================
;  BANK firmware (main_bank.cpp) — the primary build.
;  N packs make one virtual battery. It includes WiFi WebUI, MQTT, OTA and setup AP.
; ============================================================

; Generic ESP32 (WROOM-32 / WROVER / DevKitC / NodeMCU-32S), no display.
; Use this target for most boards.
[env:bank_esp32]
board = esp32dev
build_src_filter = +<main_bank.cpp> +<huawei_esm.cpp> +<pylontech.cpp>
lib_deps = knolleary/PubSubClient@^2.8
build_flags =
    ${rs485_pins.build_flags}
    -DCORE_DEBUG_LEVEL=0

; LilyGO T-Display v1.1 — same firmware with the on-board 135x240 screen.
[env:bank_tdisplay]
board = lilygo-t-display
build_src_filter = +<main_bank.cpp> +<huawei_esm.cpp> +<pylontech.cpp> +<display.cpp>
lib_deps =
    bodmer/TFT_eSPI@^2.5.0
    knolleary/PubSubClient@^2.8
build_flags =
    ${rs485_pins.build_flags}
    ${tdisplay_tft_flags.build_flags}
    -DCORE_DEBUG_LEVEL=0
    -DUSE_DISPLAY=1

; ---- OTA (espota) variants: flash once over USB, then update over WiFi. ----
; These variants use the mDNS name esm-bank.local. If mDNS does not work reliably on
; your network, set upload_port to the device IP. --auth must match OTA_PASS (default below).
[env:bank_esp32_ota]
extends = env:bank_esp32
upload_protocol = espota
upload_port = esm-bank.local
upload_flags = --auth=esmbank-ota

[env:bank_tdisplay_ota]
extends = env:bank_tdisplay
upload_protocol = espota
upload_port = esm-bank.local
upload_flags = --auth=esmbank-ota

; ============================================================
;  SINGLE-PACK converter (main_translator.cpp).
;  One ESM pack to one Deye inverter. No WiFi or WebUI. This is the minimal reference build.
; ============================================================
[env:translator_esp32]
board = esp32dev
build_src_filter = +<main_translator.cpp> +<huawei_esm.cpp> +<pylontech.cpp>
build_flags =
    ${rs485_pins.build_flags}
    -DCORE_DEBUG_LEVEL=0

[env:translator_tdisplay]
board = lilygo-t-display
build_src_filter = +<main_translator.cpp> +<huawei_esm.cpp> +<pylontech.cpp> +<display.cpp>
lib_deps = bodmer/TFT_eSPI@^2.5.0
build_flags =
    ${rs485_pins.build_flags}
    ${tdisplay_tft_flags.build_flags}
    -DCORE_DEBUG_LEVEL=0
    -DUSE_DISPLAY=1

; --- Other ESP32 variants ---------------------------------------------------
; The ESP32-S3 also has enough UARTs. Copy an environment above, set board = esp32-s3-
; devkitc-1 and select four free GPIOs with -DESM_*/-DDEYE_* to match your wiring.
; The ESP32-C3/C2/H2 have only about 2 usable UARTs. They cannot drive both RS485 buses.
